name: BTC Buy/Sell Signal Check
on:
  workflow_dispatch: {}
jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check signal
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signals.py
      - name: Commit updated state
        run: |
          git config user.name "btc-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in last_tier.txt sth_history.txt weekly_range_state.json monthly_range_state.json weekly_streak_state.json monthly_streak_state.json watched_levels_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "update signal state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push fallo, reintentando ($i)..."
            sleep $((RANDOM % 5 + 1))
          done
